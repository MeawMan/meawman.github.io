<style>
:root{
  --display:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --text:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --paper:#eef2ef;--sheet:#fafbfa;--ink:#11303a;--mute:#566b72;--rule:#c9d6d1;--grid:#dde6e2;--soft:#e3eae7;
  --obs:#1f5f94;--fill:#c4571a;--gap-rgb:84,108,116;--hot-rgb:31,95,148;
  --acc:#11303a;--acc-fg:#f4f8f6;--ok:#1b7548;--warn:#94600a;--bad:#b3261e;--focus:#1f5f94;
}
/* Colours follow the portfolio theme toggle (html[data-theme]); GapLens keeps its blue observed / orange filled pair */
html[data-theme='light']{
  --display:"Space Grotesk",system-ui,sans-serif;
  --paper:#f2f4f9;--sheet:#ffffff;--ink:#0b1222;--mute:#5b6782;--rule:#dbe2ee;--grid:#e6ebf3;--soft:#eef2f8;
  --obs:#1f5f94;--fill:#c4571a;--gap-rgb:84,100,128;--hot-rgb:31,95,148;
  --acc:#0b1222;--acc-fg:#f2f4f9;--ok:#2c8a22;--warn:#b86200;--bad:#c0264d;--focus:#0786ad;
}
html[data-theme='dark']{
  --display:"Space Grotesk",system-ui,sans-serif;
  --paper:#080b14;--sheet:#0d1322;--ink:#eef3fb;--mute:#8592ab;--rule:#1d2a44;--grid:#16213a;--soft:#121b2f;
  --obs:#74b3e8;--fill:#f2a154;--gap-rgb:140,160,190;--hot-rgb:116,179,232;
  --acc:#5be7ff;--acc-fg:#04141a;--ok:#9dff6b;--warn:#ffc857;--bad:#ff6b8b;--focus:#5be7ff;
}
/* undo the parts of tool-shell.css meant for the other tools */
html[data-theme] body{background:var(--paper)}
html[data-theme] .app{max-width:none;padding-block:0}
html[data-theme] .card{border-radius:0;box-shadow:none}
html[data-theme] .btn{border-radius:4px}
html[data-theme] .brand b{font:inherit;letter-spacing:normal}
html[data-theme] tbody tr:hover td{background:rgba(var(--gap-rgb),.07)}
html[data-theme] td{border-bottom-color:var(--rule)}
.ts-bar{position:static}
.ts-bar .ts-btn{font-family:var(--font)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light dark}html[data-theme=light]{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--acc);color:var(--acc-fg);padding:6px 12px;z-index:20}.skip:focus{left:8px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;align-self:start;display:flex;flex-direction:column;gap:26px;padding:24px 16px 20px 20px;border-right:1px solid var(--rule);overflow:auto}
.brand{display:flex;gap:11px;align-items:flex-start}
.brand svg{flex:none;margin-top:2px}
.brand h1{margin:0;font:600 1.55rem/1.05 var(--display);letter-spacing:.01em}
.brand small{display:block;margin-top:5px;color:var(--mute);font-size:.78rem;line-height:1.35}
nav{display:flex;flex-direction:column;gap:2px}
nav .gt{color:var(--mute);font-size:.8rem;margin:0 0 5px 10px}
nav .gt:not(:first-child){margin-top:18px}
nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:7px 10px;border:0;border-radius:4px;background:none;color:var(--ink);font:inherit;cursor:pointer}
nav button:hover{background:var(--soft)}
nav button[aria-selected=true]{background:var(--soft);font-weight:600;box-shadow:inset 3px 0 0 var(--ink)}
nav .mk{flex:none;width:20px;height:20px;border:1.5px solid var(--mute);border-radius:50%;display:grid;place-items:center;font:600 .74rem/1 var(--display);color:var(--mute)}
nav .mk.tool{border-radius:3px;border-style:dashed}
nav button.done .mk{background:var(--ink);border-color:var(--ink);color:var(--paper)}
nav button[aria-selected=true] .mk{border-color:var(--ink);color:var(--ink)}
nav button.done[aria-selected=true] .mk{color:var(--paper)}
.rail-foot{margin:auto 0 0;color:var(--mute);font-size:.78rem;line-height:1.4}

.main{min-width:0}
.recbar{position:sticky;top:0;z-index:6;background:var(--paper);border-bottom:1px solid var(--rule);padding:12px 40px 8px}
.rec-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 24px;margin-bottom:7px}
.rec-id{display:flex;flex-wrap:wrap;gap:2px 16px;align-items:baseline}
.rec-id b{font:600 1.05rem var(--display);letter-spacing:.01em}
.rec-id span{font-size:.84rem}
.rec-stats{display:flex;flex-wrap:wrap;gap:2px 20px;font-size:.84rem;color:var(--mute)}
.rec-stats b{color:var(--ink);font:600 1rem var(--display)}
.rec-strip{height:24px;line-height:0}
.rec-strip svg{display:block;width:100%;height:24px;border:1px solid var(--rule)}
.rec-key{display:flex;gap:16px;justify-content:flex-end;margin-top:4px;font-size:.76rem;color:var(--mute)}
.rec-key i{display:inline-block;width:14px;height:8px;margin-right:5px;vertical-align:0}
.rec-key .o{background:var(--obs)}.rec-key .f{background:var(--fill)}
.rec-key .g{background:rgba(var(--gap-rgb),.3);background-image:repeating-linear-gradient(135deg,transparent 0 2px,rgba(var(--gap-rgb),.8) 2px 3px)}

main{max-width:1110px;padding:8px 40px 90px}
.tabwrap{display:none}.tabwrap.on{display:block}
.pagehead{padding:26px 0 16px}
.pagehead h1{margin:0;font:600 2.15rem/1.1 var(--display);letter-spacing:.005em}
.pagehead p{margin:6px 0 0;color:var(--mute);max-width:64ch}

/* content */
.card{border-top:1px solid var(--rule);padding:22px 0 10px;margin:0}
.card:first-child{border-top:0;padding-top:6px}
.card h2{margin:0 0 10px;font:600 1.18rem/1.25 var(--display);letter-spacing:.01em;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.card h3{margin:20px 0 8px;font-size:.95rem}
h2 .small,h3 .small{font:400 .82rem var(--text)}
p{margin:.5em 0}
.mute{color:var(--mute)}.small{font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end}
.row.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px 48px}
.cols2{display:grid;grid-template-columns:minmax(250px,1fr) minmax(300px,1.5fr);gap:8px 40px;align-items:start}
@media (max-width:900px){.split,.cols2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--mute)}
label.inline{flex-direction:row;align-items:center;gap:7px;color:var(--ink);font-size:.9rem}
select,input[type=number],input[type=text]{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:7px 9px;font:inherit;min-width:150px}
input[type=file]{font:inherit;font-size:.85rem;color:var(--mute)}
input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px}
button.primary,a.primary{background:var(--acc);color:var(--acc-fg);border:1px solid var(--acc);border-radius:4px;padding:8px 18px;font:600 .95rem var(--text);cursor:pointer}
button.primary:hover,a.primary:hover{filter:brightness(1.18)}
button.primary:disabled{opacity:.45;cursor:default;filter:none}
button.ghost,a.ghost{background:transparent;color:var(--ink);border:1px solid var(--mute);border-radius:4px;padding:7px 14px;font:inherit;cursor:pointer}
button.ghost:hover,a.ghost:hover{background:var(--soft)}
a.btn{display:inline-block;text-decoration:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}

table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 10px;border-bottom:1px solid var(--rule);text-align:right;vertical-align:top}
th:first-child,td:first-child,td.l,th.l{text-align:left}
th{position:sticky;top:0;background:var(--paper);color:var(--mute);font-size:.8rem;font-weight:600;border-bottom:1px solid var(--ink);white-space:nowrap}
tbody tr:hover td{background:rgba(var(--gap-rgb),.07)}
.scroll{overflow:auto;max-height:460px}
td .bar{margin:5px 0 0 auto;width:70px;min-width:0}
input[type=file]::file-selector-button{background:transparent;color:var(--ink);border:1px solid var(--mute);border-radius:4px;padding:5px 11px;margin-right:9px;font:inherit;font-size:.85rem;cursor:pointer}
input[type=file]::file-selector-button:hover{background:var(--soft)}
td.c,th.c{text-align:center}

.chip{display:inline-block;padding:0 7px;border-radius:3px;font-size:.78rem;line-height:1.55;border:1px solid var(--rule);background:var(--soft);margin:1px 2px 1px 0}
.chip.code{font:600 .82rem/1.5 var(--display);border-color:var(--ink);background:transparent;letter-spacing:.02em}
.chip.on{border-color:var(--ink);font-weight:600}
.chip.good{color:var(--ok);border-color:var(--ok);background:transparent}
.chip.fair{color:var(--warn);border-color:var(--warn);background:transparent}
.chip.bad{color:var(--bad);border-color:var(--bad);background:transparent}
.note{border-left:3px solid var(--warn);background:var(--soft);padding:7px 12px;margin:8px 0}
.note.err{border-color:var(--bad)}.note.ok{border-color:var(--ok)}
.bar{height:6px;background:var(--soft);min-width:70px}.bar i{display:block;height:100%;background:var(--obs)}
.hb{display:flex;align-items:center;gap:8px;justify-content:flex-end}.hb i{display:block;height:8px;background:var(--obs);opacity:.8}
.grid{display:flex;flex-wrap:wrap;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:12px 0}
.stat{flex:1 1 130px;padding:10px 18px 10px 0;margin-right:18px;border-right:1px solid var(--rule);color:var(--mute);font-size:.84rem;line-height:1.3}
.stat:last-child{border-right:0;margin-right:0}
.stat b{display:block;color:var(--ink);font:500 1.65rem/1.15 var(--display);letter-spacing:.005em}
.empty{border:1.5px dashed var(--rule);padding:34px 24px;text-align:left;margin-top:14px;background-image:repeating-linear-gradient(135deg,transparent 0 9px,rgba(var(--gap-rgb),.06) 9px 10px)}
.empty p{margin:0 0 12px}
.drop{border:1.5px dashed var(--mute);padding:38px 24px;cursor:pointer;display:flex;flex-direction:column;gap:3px;background-color:var(--sheet);background-image:repeating-linear-gradient(135deg,transparent 0 9px,rgba(var(--gap-rgb),.07) 9px 10px)}
.drop b{font:600 1.15rem var(--display)}.drop span{color:var(--mute);font-size:.88rem}
.drop:hover,.drop.over{border-style:solid;border-color:var(--ink)}
pre{margin:8px 0;padding:10px 12px;background:var(--soft);font:.82rem/1.5 "Cascadia Mono",Consolas,Menlo,monospace;overflow:auto}
details{margin:8px 0}summary{cursor:pointer;font-weight:600;padding:2px 0}
details>summary::marker{color:var(--mute)}
.reasons{margin:4px 0 0;padding-left:18px;font-size:.84rem}.reasons li.w{color:var(--warn)}
progress{appearance:none;display:block;width:100%;height:6px;border:0;background:var(--soft);overflow:hidden}
progress::-webkit-progress-bar{background:var(--soft)}
progress::-webkit-progress-value{background:var(--obs)}
progress::-moz-progress-bar{background:var(--obs)}
progress:indeterminate{background:linear-gradient(90deg,var(--soft) 0 35%,var(--obs) 35% 65%,var(--soft) 65%);background-size:300% 100%;animation:sweep 1.4s linear infinite}
progress:indeterminate::-webkit-progress-bar{background:transparent}
@keyframes sweep{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){progress:indeterminate{animation:none}}

/* charts */
svg text{fill:var(--mute);font:11px var(--text)}
svg text.lg{paint-order:stroke;stroke:var(--sheet);stroke-width:3px;font-weight:600}
.chart{display:block;width:100%;height:auto;color:var(--ink)}
.heat{width:auto}
.heat td,.heat th{text-align:center;padding:3px 0;width:2.3rem;font-size:.8rem}
.heat td:first-child,.heat th:first-child{text-align:left;width:auto;padding-right:14px}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--paper);padding:6px 10px;font-size:.8rem;line-height:1.4;box-shadow:0 2px 10px rgba(0,0,0,.25);max-width:260px}
#tip b{display:block;font:600 .85rem var(--display);letter-spacing:.02em;margin-bottom:2px}
#tip i{display:inline-block;width:9px;height:3px;margin-right:6px;vertical-align:middle}

/* rating-curve editor */
.rt-grid{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:24px;align-items:start;margin-top:8px}
.rt-seg{border:1px solid var(--rule);border-radius:4px;padding:8px 12px 12px;margin:12px 0 0;display:grid;gap:9px;min-width:0}
.rt-seg legend{font:600 .92rem var(--display);color:var(--ink);padding:0 4px}
.rt-seg label{gap:3px}
.rt-seg input[type=number]{min-width:0;width:100%}
.rt-seg input[type=range]{width:100%;margin:2px 0 0;accent-color:var(--obs)}
.rt-seg input:disabled{opacity:.55}
input[type=date]{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;font:inherit;min-width:0}
.rt-eq{font:.86rem/1.55 ui-monospace,Consolas,monospace;background:var(--soft);padding:10px 14px;border-left:3px solid var(--ink);white-space:pre-wrap;margin:12px 0}
.rt-view svg{width:100%;height:auto;display:block}
.rt-view{position:sticky;top:96px}  /* the plot stays in view while the segment controls scroll */
.rt-res{margin-top:6px}
svg text.rt-lbl{font-size:10.5px}
#rty-out td,#rty-out th{white-space:nowrap}
.rt-ramp{display:inline-block;width:72px;height:8px;vertical-align:middle;border-radius:2px;margin-right:6px}
@media (max-width:1100px){.rt-grid{grid-template-columns:1fr}.rt-view{position:static}}

@media (max-width:860px){
  .app{display:block}
  .rail{position:static;height:auto;flex-direction:column;gap:12px;padding:14px 16px 8px;border-right:0;border-bottom:1px solid var(--rule)}
  .brand small,.rail-foot,nav .gt{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px}
  nav button{width:auto;white-space:nowrap}
  .recbar{padding:10px 16px 6px;position:static}
  .stat{flex:1 1 40%;border-right:0;margin-right:0}
  main{padding:4px 16px 70px}
  .pagehead h1{font-size:1.8rem}
}
</style>
</head>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=3)=>v==null||v===""?"":(typeof v==="number"?(Math.abs(v)>=1e5||(Math.abs(v)<1e-3&&v!==0)?v.toExponential(2):(+v.toPrecision(d)).toString()):esc(v));
const fmtDate=s=>String(s).slice(0,10);
function fmtStep(s){const m=/^(\d+) days? (\d+):(\d+):(\d+)/.exec(String(s));if(!m)return String(s);const d=+m[1],h=+m[2],mi=+m[3];
  if(d===1&&!h&&!mi)return "daily";if(d>1&&!h&&!mi)return d+" days";if(!d&&h===1&&!mi)return "hourly";if(!d&&h&&!mi)return h+" hours";if(!d&&!h&&mi)return mi+" min";return String(s)}
async function api(path,body){
  const opt=body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)};
  const r=await fetch(path,opt);let j;try{j=await r.json()}catch(e){throw new Error("The server returned no JSON ("+r.status+")")}
  if(j.error)throw new Error(j.error);return j;
}
async function poll(jobId,onProgress){
  for(;;){const j=await api("/api/job?id="+jobId);if(onProgress)onProgress(j);
    if(j.status==="done")return j.result;if(j.status==="error")throw new Error(j.error);await new Promise(r=>setTimeout(r,900));}
}
function say(el,msg,kind=""){el.innerHTML=msg?`<div class="note ${kind}" role="status">${msg}</div>`:""}
function table(rows,cols,o={}){

function findingsHtml(f,target){
  const groups=new Map();f.forEach(x=>{if(!groups.has(x.code))groups.set(x.code,{code:x.code,name:x.name,items:[]});groups.get(x.code).items.push(x)});
  if(!groups.size)return '<p class="mute">No gap types were found.</p>';
  let h='<div class="scroll"><table><thead><tr><th class="l">Type</th><th class="l">Series</th><th class="l">Strength</th><th class="l">Evidence</th></tr></thead><tbody>';
  groups.forEach(g=>{
    const best=g.items.reduce((a,b)=>(b.strength||0)>(a.strength||0)?b:a);const first=g.items.find(x=>x.scope===target)||best;
    const chips=g.items.slice(0,8).map(x=>`<span class="chip ${x.scope===target?"on":""}">${esc(x.scope)}</span>`).join(" ")+(g.items.length>8?` <span class="mute small">+${g.items.length-8} more</span>`:"");
    h+=`<tr><td class="l"><span class="chip code">${esc(g.code)}</span> ${esc(g.name||"")}</td><td class="l">${chips}</td><td class="l" style="min-width:90px"><div class="bar" style="margin-top:9px"><i style="width:${Math.round(100*(best.strength||0))}%"></i></div></td>
      <td class="l">${esc(first.evidence)}${g.items.length>1?`<details><summary>${g.items.length} series</summary><ul class="reasons">${g.items.map(x=>`<li><b>${esc(x.scope)}</b>: ${esc(x.evidence)}</li>`).join("")}</ul></details>`:""}</td></tr>`});
  return h+"</tbody></table></div>";
}

function rtPush(){S.manualRating={segments:rtSegs().map(s=>({h_from:s.h_from,a:s.a,h0:s.h0,b:s.b}))}}
/* ---- fitting the segments to the gaugings (least squares in log space, gaugings of the chosen period) ----
   Free segment: for each trial e, ln Q = ln C + n ln(h - e) is a straight line (closed form); e is searched.
   Anchored segment (continuity): the curve must pass through the end of the segment below, (hb, Qb), so
   ln Q - ln Qb = n [ln(h - e) - ln(hb - e)] and C follows; e is searched, n is closed form. */
function rtPts(){return RT.g.filter(p=>rtInRange(p)&&p.gauged>0).map(p=>({h:p.stage,lq:Math.log(p.gauged)})).sort((a,b)=>a.h-b.h)}
function rtFitSeg(pts,eLo,eHi,anchor){
  const tryE=e=>{let sx=0,sy=0,sxx=0,sxy=0,n=0;const L=[];
    for(const p of pts){const d=p.h-e;if(d<=0)return null;const x=anchor?Math.log(d)-Math.log(anchor.hb-e):Math.log(d),y=anchor?p.lq-anchor.lq:p.lq;L.push([x,y]);sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;n++}

    if(!(b>=0.8&&b<=4.5))return null;let sse=0;  /* natural controls have n of roughly 1 to 3.5; outside 0.8-4.5 the fit is not physical */for(const [x,y] of L){const r=anchor?y-b*x:y-(la+b*x);sse+=r*r}return{e,a:Math.exp(la),b,sse}};
  let best=null;const G=120;for(let i=0;i<=G;i++){const r=tryE(eLo+(eHi-eLo)*i/G);if(r&&(!best||r.sse<best.sse))best=r}

/* fit every segment for the given break stages; returns {segs, sse, n} or {error} */

    const hmin=sp[0].h,eHi=hmin-0.002*span,eLo=hmin-3*span;let anchor=null;
    if(i>0&&RT.cont){const hb=breaks[i-1],q=rtQ(hb-1e-9,out);if(q>0)anchor={hb,lq:Math.log(q)}}
    const f=rtFitSeg(sp,Math.min(eLo,anchor?anchor.hb-3*span:eLo),Math.min(eHi,anchor?anchor.hb-0.002*span:eHi),anchor);
    if(!f)return{error:`no power law fits segment ${i+1}; move its break`};
    out.push({h_from:i?breaks[i-1]:null,a:f.a,h0:f.e,b:f.b});sse+=f.sse}

  const atLimit=out.map((s,i)=>s.b<0.82||s.b>4.4?i+1:0).filter(Boolean);

/* best break stages for k segments: candidates between the 12th and 92nd percentile of the gauged stages, at least 6 gaugings each */
function rtBestBreaks(k,pts){
  pts=pts||rtPts();if(k<2)return rtFitBreaks([],pts);const hs=pts.map(p=>p.h),n=hs.length,MIN=6,cand=[];
  for(let i=0;i<=28;i++){const q=0.12+0.8*i/28,v=hs[Math.min(n-1,Math.floor(q*n))];if(!cand.length||v>cand[cand.length-1]+1e-9)cand.push(v)}

  let best=null;const consider=br=>{if(!ok(br))return;const r=rtFitBreaks(br,pts);if(!r.error&&!r.atLimit.length&&(!best||r.sse<best.sse))best=r};
  if(k===2)cand.forEach(c=>consider([c]));else for(let i=0;i<cand.length;i++)for(let j=i+1;j<cand.length;j++)consider([cand[i],cand[j]]);

/* BIC: n ln(SSE/n) + p ln n, p = 3 per segment plus each break, minus one per break when the curve is kept continuous */

/* ---------- 7b year-by-year rating ----------

const RTY={start:4,min_n:8,rule:"nearest",mode:"shared",segments:1,rows:null,sources:null,info:null,use:false};
const MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
function rtyOpts(){return{start_month:RTY.start,min_n:RTY.min_n,min_span:0.3,rule:RTY.rule,mode:RTY.mode,segments:RTY.segments}}
function rtyLabel(y){return RTY.start===1?String(y):`${y}–${String((y+1)%100).padStart(2,"0")}`}
function rtyQ(r,h){return rtQ(h,r.segments)}
/* where a year without its own curve takes one from (the same rule as the Python method) */
function rtySource(y,fy){if(fy.includes(y))return{kind:"own"};const prev=fy.filter(v=>v<y),nxt=fy.filter(v=>v>y);
  if(RTY.rule==="interpolate"&&prev.length&&nxt.length)return{kind:"interp",p:prev[prev.length-1],n:nxt[0]};
  if(RTY.rule==="previous"&&prev.length)return{kind:"from",y:prev[prev.length-1]};
  let best=fy[0];fy.forEach(v=>{if(Math.abs(v-y)<Math.abs(best-y))best=v});return{kind:"from",y:best}}

function rtyCard(){

    <div class="row fields"><label>Year starts in<select id="rty-start">${MONTH_NAMES.map((m,i)=>`<option value="${i+1}"${RTY.start===i+1?" selected":""}>${m}${i===3?" (BWDB hydrological year)":i===0?" (calendar year)":""}</option>`).join("")}</select></label>
      <label>Curve for each year<select id="rty-mode"><option value="shared"${RTY.mode==="shared"?" selected":""}>shared shape, own e each year (recommended)</option><option value="free"${RTY.mode==="free"?" selected":""}>own C, e and n each year</option></select></label>
      <label>Segments per curve<select id="rty-segs"><option value="1"${RTY.segments===1?" selected":""}>1 (one power law)</option><option value="2"${RTY.segments===2?" selected":""}>2 (break found from the gaugings)</option></select></label>

    <p class="mute small"><b>Two segments</b> add a continuous second segment above a break stage, for a change of control such as the river leaving its banks. With a shared shape the break and both exponents are common to all years (the break is usually a fixed feature such as bank-full level) and e still moves each year; with own curves each year keeps a break only when its gaugings clearly support it. <b>Shared shape</b>: C and n are fitted on all years together and each year gets its own e, the stage of zero flow that scour and siltation move. One value per year, so half the gaugings suffice, and the flood part of the curve comes from all years rather than from one year's few high gaugings. <b>Own C, e and n</b> fits each year on its own; a year then also needs gaugings over at least 30 % of the whole gauged stage range, so a year measured only at low flow does not set its flood discharges. With a blend, ln Q is interpolated between the curves of the fitted years before and after, weighted by distance in years. On a tie, the nearest rule takes the earlier year.</p>

  catch(e){say(o,esc(e.message),"err")}}
function rtyShow(){
  const o=$("#rty-out"),rows=RTY.rows,fit={};rows.forEach(r=>{if(r.status==="fitted")fit[r.year]=r});const fy=Object.keys(fit).map(Number).sort((a,b)=>a-b);
  if(!fy.length){say(o,"No year has enough gaugings for a curve of its own. Lower the number of gaugings needed, or use one curve for the whole record.","err");return}
  /* every year to report: the years with gaugings plus the years of the stage record */
  const years=[...new Set(rows.map(r=>r.year).concat(RTY.sources?Object.keys(RTY.sources).map(Number):[]))].sort((a,b)=>a-b);
  const byYear={};rows.forEach(r=>byYear[r.year]=r);
  const all=(RT.g&&RT.g.length?RT.g.map(p=>p.stage):rows.flatMap(r=>[r.h_min,r.h_max])).sort((a,b)=>a-b),href=all[Math.floor(all.length/2)];
  const srcText=y=>{const s=rtySource(y,fy);return s.kind==="own"?"own curve":s.kind==="from"?`curve of ${rtyLabel(s.y)}`:`blend of ${rtyLabel(s.p)} and ${rtyLabel(s.n)}`};
  const y0=fy[0],y1=fy[fy.length-1];
  /* overlay of the yearly curves */
  const W=640,H=330,L=60,R=14,Tp=12,B=40,hs=rows.flatMap(r=>[r.h_min,r.h_max]),hmin=Math.min(...hs),hmax=Math.max(...hs),span=hmax-hmin||1,yb=hmin-0.05*span,yt=hmax+0.12*span;
  const curves=fy.map(y=>{const pts=[];for(let i=0;i<=80;i++){const h=yb+(yt-yb)*i/80,q=rtyQ(fit[y],h);if(q>0)pts.push([h,q])}return{y,pts}});
  const qmax=Math.max(...curves.flatMap(c=>c.pts.map(p=>p[1])),...(RT.g||[]).map(p=>p.gauged))*1.04;
  const X=q=>L+(W-L-R)*q/qmax,Y=h=>Tp+(H-Tp-B)*(1-(h-yb)/(yt-yb));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="curves by year"><rect x="${L}" y="${Tp}" width="${W-L-R}" height="${H-Tp-B}" style="fill:var(--sheet);stroke:var(--rule)"/>`;
  niceTicks(0,qmax).forEach(v=>{s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${Tp}" y2="${H-B}" style="stroke:var(--grid)"/><text x="${X(v)}" y="${H-B+15}" text-anchor="middle">${fmt(v,3)}</text>`});
  niceTicks(yb,yt).forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--grid)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v,3)}</text>`});
  (RT.g||[]).forEach(p=>{s+=`<circle cx="${X(p.gauged)}" cy="${Y(p.stage)}" r="2" style="fill:var(--mute)" fill-opacity=".35"/>`});
  curves.forEach(c=>{s+=`<polyline fill="none" style="stroke:${rtYearColor(c.y,y0,y1)}" stroke-width="1.8" points="${c.pts.map(p=>X(p[1])+","+Y(p[0])).join(" ")}"><title>${rtyLabel(c.y)}</title></polyline>`});
  s+=`<text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle">discharge Q</text><text transform="translate(14 ${(Tp+H-B)/2}) rotate(-90)" text-anchor="middle">stage h</text></svg>`;
  /* discharge at a fixed stage, year by year: the drift of the channel */
  const qs=years.map(y=>({y,q:rtyQat(y,href,fit,fy),own:!!fit[y]})),DW=640,DH=220,dL=60,dB=40,dT=12,qv=qs.map(v=>v.q).filter(v=>v>0),qlo=Math.min(...qv)*0.9,qhi=Math.max(...qv)*1.08;
  const DX=y=>dL+(DW-dL-R)*(years.length>1?(y-years[0])/(years[years.length-1]-years[0]):0.5),DY=q=>dT+(DH-dT-dB)*(1-(q-qlo)/(qhi-qlo||1));
  let d=`<svg class="chart" viewBox="0 0 ${DW} ${DH}" role="img" aria-label="discharge at a fixed stage by year"><rect x="${dL}" y="${dT}" width="${DW-dL-R}" height="${DH-dT-dB}" style="fill:var(--sheet);stroke:var(--rule)"/>`;
  niceTicks(qlo,qhi,4).forEach(v=>{d+=`<line x1="${dL}" x2="${DW-R}" y1="${DY(v)}" y2="${DY(v)}" style="stroke:var(--grid)"/><text x="${dL-6}" y="${DY(v)+4}" text-anchor="end">${fmt(v,3)}</text>`});
  years.forEach((y,i)=>{if(years.length<=16||i%Math.ceil(years.length/12)===0)d+=`<text x="${DX(y)}" y="${DH-dB+15}" text-anchor="middle">${y}</text>`});
  d+=`<polyline fill="none" style="stroke:var(--mute)" stroke-width="1.2" points="${qs.filter(v=>v.q>0).map(v=>DX(v.y)+","+DY(v.q)).join(" ")}"/>`;
  qs.forEach(v=>{if(v.q>0)d+=`<circle cx="${DX(v.y)}" cy="${DY(v.q)}" r="4.5" style="${v.own?`fill:${rtYearColor(v.y,y0,y1)}`:"fill:var(--sheet);stroke:var(--ink)"}" stroke-width="1.4"><title>${rtyLabel(v.y)}: Q = ${fmt(v.q,4)} at h = ${fmt(href,4)} (${srcText(v.y)})</title></circle>`});
  d+=`<text x="${(dL+DW-R)/2}" y="${DH-6}" text-anchor="middle">year (filled: own curve · hollow: borrowed)</text><text transform="translate(14 ${(dT+DH-dB)/2}) rotate(-90)" text-anchor="middle">Q at h = ${fmt(href,3)}</text></svg>`;
  const nOwn=fy.length,nBor=years.length-nOwn;
  const tbl=`<div class="scroll"><table><thead><tr><th class="l">Year</th><th>Gaugings</th><th>Stage range</th><th>C</th><th>e</th><th>n</th><th>Break h</th><th>SE %</th><th>Bias %</th><th class="l">Curve</th><th></th></tr></thead><tbody>${years.map(y=>{const r=byYear[y]||{n:0};const own=!!fit[y];
      return `<tr><td class="l">${rtyLabel(y)}</td><td>${r.n||0}</td><td>${r.h_min!=null?fmt(r.h_min,3)+" – "+fmt(r.h_max,3):"–"}</td><td>${own?fmt(r.a,4):""}</td><td>${own?fmt(r.h0,4):""}</td><td>${own?fmt(r.b,3)+(r.b2!=null?" / "+fmt(r.b2,3):""):""}</td><td>${own&&r.hb!=null?fmt(r.hb,4):""}</td><td>${own?fmt(r.se_pct,3):""}</td><td>${own?fmt(r.bias_pct,2):""}</td>
        <td class="l">${own?"own curve"+(r.note?` <span class="mute small">(${esc(r.note)})</span>`:""):`${esc(srcText(y))}${r.status&&r.status!=="fitted"?` <span class="mute small">(${esc(r.status)})</span>`:r.n?"":` <span class="mute small">(no gaugings)</span>`}`}</td>
        <td>${own?`<button class="ghost rty-open" data-y="${y}" type="button" style="padding:3px 10px">Open in editor</button>`:""}</td></tr>`}).join("")}</tbody></table></div>`;
  const I=RTY.info||{},advice=I.mode==="shared"&&I.bic&&I.bic[2]!=null?`<div class="note${I.supported===2?" ok":""}">${I.segments_used===2?`One break for all years at h = ${fmt(I.hb,4)}. `:""}${I.supported===2?"On the gaugings, two segments are supported":"The gaugings do not support a second segment"} (BIC with 1 segment ${fmt(I.bic[1],4)}, with 2 segments ${fmt(I.bic[2],4)}; a second segment needs a drop of 6 or more).${I.supported===2?" Gaugings alone can be fooled by seasonal or hysteresis effects: confirm it on the record with the test below.":" One segment per year is the better choice."}</div>`:I.mode==="free"&&RTY.segments===2?`<div class="note">${rows.filter(r=>r.hb!=null).length} of ${fy.length} years have a break of their own; the others keep one segment (see the notes in the table).</div>`:"";
  const tester=`<div class="actions" style="margin:6px 0 0;align-items:center"><button class="ghost" id="rty-test" type="button">Test 1 against 2 segments on the record</button><span class="small mute">hides parts of the discharge record and refills them with each choice (needs the record loaded, with stage as the driver)</span></div><div id="rty-test-out"></div>`;
  o.innerHTML=`${advice}${tester}<div class="grid"><div class="stat"><b>${nOwn}</b>years with their own curve</div><div class="stat"><b>${nBor}</b>years borrowing a curve</div><div class="stat"><b>${fmt(Math.min(...qv),3)} – ${fmt(Math.max(...qv),3)}</b>Q at h = ${fmt(href,3)} across the years</div></div>
    <div class="cols2"><div><h3>Curves by year</h3>${s}</div><div><h3>Discharge at a fixed stage</h3>${d}<p class="mute small">The discharge each year's curve gives at the median gauged stage. A steady trend means the channel is changing; a jump points to a scour or siltation event.</p></div></div>
    ${tbl}
    <div class="actions"><label class="inline"><input type="checkbox" id="rty-use"${RTY.use?" checked":""}><span>use the year-by-year curves as the method <b>rating_yearly</b> in Compare and Fill</span></label></div>
    <div class="actions"><button class="primary" id="rty-fill" type="button">Fill discharge gaps year by year</button><button class="ghost" id="rty-apply" type="button">Apply to the stage series</button></div><div id="rty-apply-out"></div>`;
  o.querySelectorAll(".rty-open").forEach(b=>b.onclick=()=>{const y=+b.dataset.y,r=fit[y],st=String(RTY.start).padStart(2,"0");
    RT.from=`${y}-${st}-01`;RT.to=new Date(Date.UTC(y+1,RTY.start-1,1)-86400000).toISOString().slice(0,10);RT.segs=r.segments.map(s=>Object.assign({},s));
    rtEditor();$("#rt-editor").scrollIntoView({behavior:"smooth"});say($("#rt-fitmsg"),`The curve of ${rtyLabel(y)}, with only that year's gaugings counted. Adjust it here; the year-by-year table keeps the fitted curve.`)});
  $("#rty-use").onchange=e=>{RTY.use=e.target.checked};
  /* the decisive check: the same hold-out test as Compare, for one and for two segments */
  $("#rty-test").onclick=async()=>{const to=$("#rty-test-out"),p=settings();
    if(!S.ds||!p.target||!p.driver){say(to,"Load the discharge record on the Data page and set the stage column as the driver first.","err");return}
    $("#rty-test").disabled=true;say(to,"Testing: hiding parts of the record and refilling them with each choice…");
    try{const res={};for(const k of [1,2]){const {job}=await api("/api/compare",Object.assign({},p,{methods:["rating_yearly"],n_rep:3,yearly_rating:Object.assign(rtyOpts(),{segments:k})}));const r=await poll(job);
        const m=(r.summary||[])[0]||{};res[k]={nse:m["efficiency.nse"],rmse:m["pointwise.rmse"],bias:m["pointwise.bias"]}}
      const better=res[2].rmse<res[1].rmse*0.97?2:1;
      to.innerHTML=`<div class="note ${better===RTY.segments?"ok":""}"><b>On the record:</b> 1 segment RMSE ${fmt(res[1].rmse,3)}, NSE ${fmt(res[1].nse,4)} · 2 segments RMSE ${fmt(res[2].rmse,3)}, NSE ${fmt(res[2].nse,4)}. ${better===2?"Two segments fill the record better.":"One segment fills the record as well or better; keep it simple."} (Two segments must lower the RMSE by at least 3 % to count.)</div>`}
    catch(e){say(to,esc(e.message),"err")}$("#rty-test").disabled=false};
  $("#rty-fill").onclick=()=>{if(!S.ds){say($("#rty-apply-out"),"Load the data with the discharge series to fill first (Data page).","err");return}
    RTY.use=true;$("#rty-use").checked=true;S.fillMethods=["rating_yearly"];$("#t-fill").innerHTML="";show("fill")};
  $("#rty-apply").onclick=async()=>{const ao=$("#rty-apply-out"),sc=$("#r-stage").value;if(!S.ds||!sc){say(ao,"Choose the stage series of the loaded data at the top of this page first.","err");return}
    try{const a=await api("/api/rating",{gaugings_id:S.gaug,id:S.ds.id,stage_col:sc,yearly_rating:rtyOpts()});
      ao.innerHTML=`<h3>Discharge from ${esc(sc)}, year by year</h3>${a.above_gauged_pct>0?`<div class="note">${fmt(a.above_gauged_pct,2)} % of the stage record is above the highest gauging: those discharges are extrapolated.</div>`:""}${lineChart([{t:a.discharge_yearly.t,mean:a.discharge_yearly.mean,lo:a.discharge_yearly.lo,hi:a.discharge_yearly.hi,label:"year by year"},{t:a.discharge.t,mean:a.discharge.mean,color:"var(--mute)",label:"one curve for all years"}])}`}
    catch(e){say(ao,esc(e.message),"err")}};
}
/* ---------- methods ---------- */
async function loadMethods(){
  const box=$("#t-meth");box.innerHTML='<div class="card"><progress></progress></div>';const r=await api("/api/methods");S.meth=r;
  const draw=q=>{const rows=r.methods.filter(m=>(m.id+m.name+m.family+m.variables.join(" ")+m.best_for.join(" ")).toLowerCase().includes(q.toLowerCase()));$("#m-table").innerHTML=table(rows,["id","name","family","variables","best_for","cost","library","limits"],{left:["id","name","family","variables","best_for","library","limits"],html:{variables:v=>esc(v.join(", ")),best_for:v=>esc(v.join(", "))}});$("#m-count").textContent=rows.length+" of "+r.methods.length+" methods"};
  box.innerHTML=`<div class="card"><h2>Method catalogue</h2><div class="row"><label>Filter<input type="text" id="m-q" placeholder="rain, tide, kriging, G3 ..."></label><span class="mute small" id="m-count"></span></div><div id="m-table" style="margin-top:10px"></div></div>
  <div class="card"><h2>Gap types</h2>${table(Object.entries(r.gap_types).map(([k,v])=>({code:k,type:v})),null,{left:["code","type"],html:{code:v=>`<span class="chip code">${esc(v)}</span>`}})}<p class="mute small">gaplens ${esc(r.version)}</p></div>`;
  $("#m-q").oninput=e=>draw(e.target.value);draw("");
}
drawData();drawVal();drawRate();
